<body class="bg-slate-50 text-slate-900 antialiased selection:bg-burgundy selection:text-white">

  <!-- ==================== PAGE TITLE ==================== -->
  <section class="page-hero relative overflow-hidden text-white bg-gradient-to-br from-slate-900 via-slate-900 to-[#3a0012]">
    <img src="assets/img/world-map.svg" alt="" aria-hidden="true" class="absolute -right-24 top-1/2 -translate-y-1/2 h-[135%] w-auto max-w-none opacity-[0.07] pointer-events-none select-none">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 pb-10 md:pb-14">
      <nav class="text-xs text-slate-300 mb-3" aria-label="Breadcrumb">
        <a href="index.html" class="hover:text-white underline-offset-2 hover:underline" data-i18n="crumb_home">首頁</a>
        <span class="mx-1.5 text-slate-500" aria-hidden="true">/</span>
        <span data-i18n="nav_about">關於學程</span>
      </nav>
      <div class="text-xs font-bold uppercase tracking-widest text-amber-300 mb-1 font-mono">About the Program</div>
      <h1 class="font-serif text-3xl sm:text-4xl font-bold tracking-tight" data-i18n="nav_about">關於學程</h1>
    </div>
  </section>

  <!-- ==================== ABOUT imMBA (EDITORIAL 2-COLUMN) ==================== -->
  <section id="overview" class="py-20 bg-slate-50 border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <div class="grid lg:grid-cols-12 gap-12 items-start">
        <!-- Left Photo Banner -->
        <div class="lg:col-span-5 lg:mt-6 relative group overflow-hidden shadow-md bg-slate-900">
          <img src="https://www.management.fju.edu.tw/upfiles/tw_/menu01495163361.jpg" alt="FJCU imMBA Learning Environment" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">

          </div>
        </div>

        <!-- Right Editorial Content -->
        <div class="lg:col-span-7">
          <div class="text-xs font-bold uppercase tracking-widest text-burgundy mb-2 font-mono">Academic Distinction</div>
          <h2 class="font-serif text-3xl font-bold text-slate-900 mb-6" data-i18n="sec_about_title">輔大 imMBA 卓越優勢</h2>
          <p class="text-slate-600 text-sm leading-relaxed mb-8">
            輔仁大學是知名綜合型大學，歷史悠久，在國際上擁有獨特的天主教與耶穌會黃金校友網絡。輔大管理學院於 2005 年通過 AACSB 國際商學院認證（兩岸首家），並於 2010、2015、2020 及 2025 年連續持續通過認證，辦學品質榮獲全球前 5% 頂尖商學院認證肯定。
          </p>

          <!-- Key rankings (short) -->
          <div id="stats-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <!-- Rendered dynamically by app.js -->
          </div>

      <div id="features-grid" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6 mt-12">

      </div>
