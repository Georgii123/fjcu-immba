<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>招生專區 | 輔仁大學 imMBA</title>
  <meta name="description" content="輔仁大學國際經營管理碩士班 (imMBA) 入學管道、應繳資料與報名。">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Fonts & CSS -->
  <link rel="stylesheet" href="assets/css/main.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            burgundy: '#800020',
            burgundyDark: '#5A0016',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-burgundy selection:text-white">

  <script src="assets/js/site-chrome.js" data-page="admissions"></script>

  <!-- Room for the header (no title banner on this page); it shrinks when the menu is collapsed by hand, like the home banner -->
  <div class="page-top-spacer" aria-hidden="true"></div>

  <!-- ==================== ADMISSIONS (same look as About: pale grey section, white cards) ==================== -->
  <section id="admissions" class="py-20 bg-slate-50 border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="max-w-3xl mb-12">
        <h2 class="font-serif text-3xl font-bold text-slate-900 mb-3" data-i18n="sec_admissions_title">招生與選拔</h2>
        <p class="text-slate-600 text-base leading-relaxed" data-i18n="sec_admissions_subtitle">針對國內甄試/碩士班及外國學生提供完整入學管道與獎學金。</p>
      </div>

      <h3 class="font-serif text-xl font-bold text-slate-900 mb-4" data-i18n="adm_tracks_title">國內學生入學管道</h3>
      <div id="admission-tracks" class="grid md:grid-cols-2 gap-6 mb-14">
        <!-- Rendered dynamically by app.js -->
      </div>

      <h3 id="documents" class="font-serif text-xl font-bold text-slate-900 mb-4" data-i18n="adm_docs_title">書面審查應繳資料</h3>
      <ul id="admission-docs" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
        <!-- Rendered dynamically by app.js -->
      </ul>
    </div>
  </section>

  <!-- ==================== INTERNATIONAL ==================== -->
  <section id="international" class="py-20 bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid lg:grid-cols-12 gap-12 items-start">
      <h2 class="lg:col-span-5 font-serif text-3xl font-bold text-slate-900" data-i18n="adm_intl_title">國際學生申請</h2>
      <div id="admission-intl" class="lg:col-span-7 text-slate-600 text-base leading-relaxed space-y-4">
        <!-- Rendered dynamically by app.js -->
      </div>
    </div>
  </section>

  <!-- ==================== APPLY ==================== -->
  <section id="apply" class="py-20 bg-slate-50 border-b border-slate-200">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
      <h2 class="font-serif text-3xl font-bold text-slate-900 mb-3" data-i18n="nav_adm_tracks">報名輔大 imMBA</h2>
      <p class="text-sm text-slate-600 leading-relaxed mb-8" data-i18n="adm_apply_text">報名在輔仁大學管理學院的官方報名系統進行。請先確認上方的入學管道與應繳資料，再前往報名。</p>
      <a href="https://www.management.fju.edu.tw/esubweb/immbaengindex/enroll.php?IID=3" target="_blank" rel="noopener" class="inline-block px-10 py-3.5 bg-burgundy hover:bg-burgundyDark text-white font-bold text-xs uppercase tracking-widest shadow-md transition"><span data-i18n="btn_apply">立即報名</span> <svg class="inline-block w-3 h-3 ml-0.5 -mt-0.5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 3h7v7m0-7L10 14M19 14v5a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h5"/></svg></a>
    </div>
  </section>


  <!-- Scripts -->
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
