<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>輔仁大學國際經營管理碩士班 (imMBA) | Fu Jen Catholic University imMBA</title>
  <meta name="description" content="輔仁大學國際經營管理碩士學位學程 (imMBA) - 全英語授課、AACSB 國際權威認證、Eduniversal 全台前三、提供西班牙巴塞隆納雙碩士學位與全球姊妹校交換。">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Fonts & CSS -->
  <link rel="stylesheet" href="assets/css/main.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            burgundy: '#800020',
            burgundyDark: '#5A0016',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-burgundy selection:text-white">

  <script src="assets/js/site-chrome.js" data-page="home"></script>

  <!-- ==================== HERO ==================== -->
  <section id="hero" class="relative overflow-hidden text-white bg-gradient-to-br from-slate-900 via-slate-900 to-[#3a0012]">
    <img src="assets/img/globe-hero.svg" alt="" aria-hidden="true" style="top:calc(50% + var(--hdr-h, 0px) / 2); height:calc(100% - var(--hdr-h, 0px) - 3rem)" class="absolute left-1/2 -translate-x-1/2 -translate-y-1/2 w-auto max-w-none opacity-70 pointer-events-none select-none">
    <div class="absolute inset-0 bg-slate-950/35 pointer-events-none" aria-hidden="true"></div>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 py-24 md:py-36">
      <div class="max-w-3xl mx-auto text-center">
        <div class="inline-block px-3 py-1 bg-burgundy text-white text-xs font-mono font-bold uppercase tracking-widest mb-6">
          <span data-i18n="hero_badge">AACSB ACCREDITED | EDUNIVERSAL TOP 3 IN TAIWAN</span>
        </div>

        <!-- Headline -->
        <h1 class="font-serif text-4xl sm:text-5xl lg:text-6xl font-bold tracking-tight leading-tight mb-6" data-i18n="hero_title">培育引領全球商業未來的國際管理領袖</h1>

        <!-- Value proposition -->
        <p class="text-base sm:text-lg text-slate-200 mb-10 leading-relaxed font-light" data-i18n="hero_subtitle">輔仁大學國際經營管理碩士班 (imMBA) — 100% 全英語授課、歐洲名校雙碩士學位與跨國多元文化學習環境。</p>

        <!-- CTA buttons -->
        <div class="flex flex-wrap items-center justify-center gap-4">
          <a href="https://www.management.fju.edu.tw/esubweb/immbaengindex/enroll.php?IID=3" target="_blank" rel="noopener" class="px-8 py-3.5 bg-burgundy hover:bg-burgundyDark text-white font-bold text-xs uppercase tracking-widest shadow-md transition"><span data-i18n="hero_cta_apply">立即報名</span> <svg class="inline-block w-3 h-3 ml-0.5 -mt-0.5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 3h7v7m0-7L10 14M19 14v5a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h5"/></svg></a>
          <a href="https://www.management.fju.edu.tw/esubweb/immbaengindex/" target="_blank" rel="noopener" class="px-8 py-3.5 bg-white text-slate-900 hover:bg-slate-100 font-bold text-xs uppercase tracking-widest transition"><span data-i18n="hero_cta_explore">了解學程</span> <svg class="inline-block w-3 h-3 ml-0.5 -mt-0.5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 3h7v7m0-7L10 14M19 14v5a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h5"/></svg></a>
        </div>
      </div>
    </div>
  </section>


  <!-- ==================== LATEST NEWS & INSIGHTS ==================== -->
  <section id="news" class="py-20 bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

      <div class="max-w-3xl mb-12">
        <h2 class="font-serif text-3xl font-bold text-slate-900" data-i18n="sec_news_title">最新公告</h2>
        <p class="text-slate-500 text-xs mt-1" data-i18n="sec_news_subtitle">即時掌握最新招生時程、新開課程與國際合作夥伴動態。</p>
      </div>

      <!-- Announcement cards -->
      <div id="announcements-list" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Rendered dynamically by app.js -->
      </div>

      <!-- Source reference -->
      <!-- Show first 3, expand to see all -->
      <div class="mt-8 text-center">
        <button id="news-toggle" type="button" aria-expanded="false" aria-controls="announcements-list" class="hidden px-8 py-3 bg-slate-900 hover:bg-burgundy text-white text-xs font-bold uppercase tracking-widest transition"></button>
      </div>

      <p id="news-source" class="mt-10 pt-4 border-t border-slate-200 text-[11px] text-slate-500"></p>
    </div>
  </section>


  <!-- ==================== MODALS ==================== -->
  
  <!-- Announcement Modal -->
  <div id="modal-announcement" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white max-w-2xl w-full p-6 sm:p-8 max-h-[90vh] overflow-y-auto animate-modal border border-slate-200">
      <div class="flex items-start justify-between mb-4 border-b border-slate-100 pb-4">
        <div>
          <span id="modal-date" class="text-xs font-bold text-burgundy uppercase font-mono"></span>
          <h3 id="modal-title" class="font-serif text-xl font-bold text-slate-900 mt-1"></h3>
        </div>
        <button onclick="closeAnnouncementModal()" class="text-slate-400 hover:text-slate-700 text-2xl font-bold p-1">×</button>
      </div>
      <div id="modal-body" class="text-slate-700 text-xs leading-relaxed space-y-4"></div>
      <div class="mt-6 pt-4 border-t border-slate-100 text-right">
        <button onclick="closeAnnouncementModal()" class="px-5 py-2 bg-slate-900 text-white text-xs font-bold uppercase hover:bg-burgundy transition">關閉 Close</button>
      </div>
    </div>
  </div>

  <!-- Search Modal -->
  <div id="modal-search" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-sm flex items-start justify-center pt-20 p-4">
    <div class="bg-white max-w-xl w-full p-4 animate-modal border border-slate-200 shadow-2xl">
      <div class="flex items-center gap-2 border-b border-slate-200 pb-3">
        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input id="search-input" type="text" placeholder="站內搜尋公告、課程或師資..." class="w-full text-slate-900 text-xs focus:outline-none">
        <button onclick="closeSearchModal()" class="text-xs text-slate-400 font-bold uppercase px-2">ESC</button>
      </div>
      <div id="search-results" class="mt-3 max-h-80 overflow-y-auto">
        <p class="text-xs text-slate-400 text-center py-4">輸入關鍵字搜尋公告、課程或師資...</p>
      </div>
    </div>
  </div>


  <!-- Scripts -->
  <script src="assets/js/data.js"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/news-seed.js"></script>
  <script src="assets/js/news-store.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
